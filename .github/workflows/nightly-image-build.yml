name: Kickoff Nightly builds
run-name: Kickoff nightly builds $(date +'%m-%d-%Y')
on:
  # Run manually
  workflow_dispatch:
  # Run on 1st-10th day each month at 4PM PST / 5PM PDT
  schedule:
    - cron: '0 0 1-10 * *'
jobs:
  generate-version-matrix:
    name: Generate version matrix
    runs-on: ubuntu-latest
    if: github.repository == 'aws/sagemaker-distribution'
    outputs:
        matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Get versions from schedule
        id: set-matrix
        env:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SCHEDULE='${{ vars.NIGHTLY_BUILD_SCHEDULE }}'
          echo "Triggering builds for $(echo $SCHEDULE | jq -c '.active_nightly_builds')"
          echo "matrix=$SCHEDULE" >> $GITHUB_OUTPUT
  start-minor-build:
    name: Start nightly minor build
    needs: generate-version-matrix
    permissions:
      pull-requests: write
      contents: write
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false
    uses: aws/sagemaker-distribution/.github/workflows/build-image.yml@main
    secrets: inherit
    with:
      release-type: "minor"
      base-version: ${{ matrix.minor_base_versions }}
  start-patch-build:
    name: Start nightly patch build
    needs: generate-version-matrix
    permissions:
        pull-requests: write
        contents: write
        id-token: write
    strategy:
        matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
        fail-fast: false
    uses: aws/sagemaker-distribution/.github/workflows/build-image.yml@main
    secrets: inherit
    with:
        release-type: "patch"
        base-version: ${{ matrix.patch_base_versions }}